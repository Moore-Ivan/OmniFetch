# ============================================================
# FlatLaf 全局外观定制
# FlatLaf 启动时会自动加载 classpath 根目录下的本文件（light/dark 通用）
# ============================================================

# ---- 品牌强调色（焦点环 / 默认按钮 / 进度条 / 复选框等统一取色）----
Component.accentColor = #3D7EFF
Component.focusColor = #3D7EFF

# ---- 统一圆角 ----
Component.arc = 10
Button.arc = 10
CheckBox.arc = 7
ProgressBar.arc = 999

# ---- 细节 ----
Component.focusWidth = 1
Component.boldText = false
Button.default.borderWidth = 1

# ---- 细滚动条（圆角胶囊样式）----
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2,2,2,2

# ---- 表格可读性（斑马纹 + 水平细分隔线，颜色跟随主题）----
Table.showHorizontalLines = true
Table.alternateRowColor = true

# ---- FlatLaf 自绘标题栏（与主题统一，跨平台一致）----
TitlePane.useWindowDecorations = true
