pluginManagement {
    repositories {
        // 本地 Maven 默认不启用，避免拖慢构建和引入不完整模块。
        // 如需使用本地 SNAPSHOT，请放到仓库列表最后，并建议加 content 过滤。
        // mavenLocal()

        // 国内镜像：Gradle 插件专用镜像优先
        maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
        maven { url = uri('https://maven.aliyun.com/repository/public') }
        maven { url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }
        maven { url = uri('https://repo.huaweicloud.com/repository/maven/') }

        // 官方兜底源
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // 优先使用本文件统一配置的仓库；子项目若自行声明仓库，则子项目优先。
    // 如需强制所有子项目只能使用本文件仓库，可改为 RepositoriesMode.FAIL_ON_PROJECT_REPOS。
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        // 本地 Maven 默认不启用，避免拖慢依赖解析。
        // 如需使用本地 SNAPSHOT，请放到仓库列表最后，并建议加 content 过滤。
        // mavenLocal()

        // 国内镜像
        maven { url = uri('https://maven.aliyun.com/repository/public') }
        maven { url = uri('https://maven.aliyun.com/repository/google') }
        maven { url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }
        maven { url = uri('https://repo.huaweicloud.com/repository/maven/') }

        // 官方兜底源
        google()
        mavenCentral()
    }
}

rootProject.name = 'OmniFetch'